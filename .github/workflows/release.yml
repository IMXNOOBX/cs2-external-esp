name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        run: msbuild cs2-external-esp.sln /p:Configuration=Release

      - name: Prepare artifacts
        run: |
          mkdir release
          xcopy x64\Release\* release\ /E /I /Y
          copy README.md release\README.md
          copy LICENSE release\LICENSE

      - name: Fetch latest cloudflared
        id: cloudflared
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'cs2-external-esp-release'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/cloudflare/cloudflared/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'cloudflared-windows-amd64.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'cloudflared release has no windows-amd64 asset.' }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile release\cloudflared.exe -UseBasicParsing

          $hash = (Get-FileHash release\cloudflared.exe -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest) {
            $expected = ($asset.digest -replace '^sha256:', '').ToLower()
            if ($hash -ne $expected) { throw "cloudflared checksum mismatch: got $hash, expected $expected" }
          } else {
            Write-Warning 'cloudflared release published no digest; skipping checksum verification.'
          }

          "version=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Bundled cloudflared $($release.tag_name) (sha256 $hash)"

      - name: Archive artifacts
        run: |
          powershell Compress-Archive -Path release\* -DestinationPath release.zip

      - name: Generate tag
        id: tag
        run: |
          if ("${{ inputs.release_type }}" -eq "pre-release") {
            echo "tag=pre-release-${{ github.run_number }}" >> $env:GITHUB_OUTPUT
            echo "name=Pre-Release" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=release-${{ github.run_number }}" >> $env:GITHUB_OUTPUT
            echo "name=Release" >> $env:GITHUB_OUTPUT
          }

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag (before the one we just created)
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="${{ steps.tag.outputs.tag }}" 2>/dev/null || echo "$(git rev-list --max-parents=0 HEAD)")
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          RUN_ID="${{ github.run_id }}"
          
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📋 Overview" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "This build has been generated by the [release workflow](https://github.com/IMXNOOBX/cs2-external-esp/blob/main/.github/workflows/auto_build.yml) with the code published on the repository." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "> ⚠️ **This is a preview build.** We encourage you to build it yourself from the source code to ensure integrity and transparency." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "> 🔒 **cloudflared ${{ steps.cloudflared.outputs.version }} is bundled** as \`cloudflared.exe\` for the optional radar sharing feature." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📦 Artifacts" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**[Generated artifacts](https://github.com/$REPO_OWNER/$REPO_NAME/actions/runs/$RUN_ID)**" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📝 Changes since $LAST_TAG" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $LAST_TAG..HEAD --pretty=format:"- %h: %s" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### ℹ️ Build Information" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- **Workflow:** [auto_build.yml](https://github.com/IMXNOOBX/cs2-external-esp/blob/main/.github/workflows/auto_build.yml)" >> CHANGELOG.md
          echo "- **Source:** [Repository](https://github.com/$REPO_OWNER/$REPO_NAME)" >> CHANGELOG.md
          echo "- **Build ID:** \`$RUN_ID\`" >> CHANGELOG.md
          echo "- **cloudflared:** \`${{ steps.cloudflared.outputs.version }}\` (bundled, optional)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }} (v${{ github.run_number }})
          body_path: CHANGELOG.md
          files: release.zip
          prerelease: ${{ inputs.release_type == 'pre-release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
